device: "cuda"
seed: 20
embed_size: 1024
temp: 0.07
# queue_size: 5120
json_files: ['SMC_CodecCLAP/data/json_files/BBC_Sound_Effects/bbc_final.json', 'SMC_CodecCLAP/data/json_files/FreeSound/fsd_final.json', 'SMC_CodecCLAP/data/json_files/SoundBible/sb_final.json', "SMC_CodecCLAP/data/json_files/AudioSet_SL/as_final.json"]
# json_files: ["retrieval/data/Clotho/json_files/test.json"]
resume: false
# blacklist: "SMC_CodecCLAP/data/json_files/blacklist/blacklist_exclude_all_ac.json" # zero shot 
blacklist: "SMC_CodecCLAP/data/json_files/blacklist/blacklist_exclude_test_ac.json" # exclude ac test
# blacklist: null
embed_regularization: true
data_dir: "/SMC_CodecCLAP/datasets/WavCaps/waveforms"
bucket: False

dist_args:
  world_size: 1 # fake value
  dist_url: "env://" # TO CHECK

audio_args:
  # sr: 32000 # for non-dac usage
  # sr: 16000 # for dac only
  # sr: 44100 # for dac only
  sr: 24000 # for Encodec
  n_fft: 1024
  hop_length: 320
  f_min: 50
  f_max: 14000
  n_mels: 64
  max_length: 10 # htsat:10; CNN:30;
  mono: True


audio_encoder_args:
  type: "mae"
  model: "mae"
  pretrained: True 
  freeze: False
  spec_augment: False
  # audio_width: 576000 # (75*10)*768 = 576000 ec-ec-base
  audio_width: 768000 # ec-ec-large
  # audio_width: 768 # ec-ec-large pooling
  dim_reduced: False


data_args:
  batch_size: 128
  num_workers: 64


text_encoder_args:
  type: 'bert-base-uncased'
  freeze: False


optim_args:
  lr: !!float 5e-5
  warmup_steps: 0
  optimizer_name: "adam"
  betas: [0.9, 0.999]
  eps: !!float 1e-8
  momentum: 0.9
  warmup_epochs: 2


training:
  spec_augmentation: False
  epochs: 15
  clip_grad: 2
  dropout: 0.2